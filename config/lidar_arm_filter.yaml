# LaserScan box filter to remove the RoArm-M3 arm from the LiDAR scan.
#
# The arm is mounted right by the C1 LiDAR and its base sits INSIDE the scan
# plane, ~0.13 m away, showing up as ~20 beams at laser-frame angles +2..+14 deg
# (a fixed phantom obstacle). That permanently triggered the collision_monitor
# Stop polygon -> every Nav2 goal died with "Failed to make progress".
#
# We null out a small box (in the `laser` frame) covering the arm's cross-section
# so all /scan consumers (collision_monitor, costmaps, AMCL) get clean data.
# Measured arm points: x in [0.126,0.140], y in [0.005,0.031]; box adds margin.
#
# LIMITATION: this masks only the PARKED arm pose. If the arm is driven out into
# the scan plane elsewhere it will still create phantom returns -> a proper fix
# would be a URDF-based robot_body_filter. Fine while the arm is stowed.
/**:
  ros__parameters:
    filter1:
      name: arm_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: laser
        min_x: 0.05
        max_x: 0.26
        min_y: -0.09
        max_y: 0.14
        min_z: -1.0
        max_z: 1.0
        invert: false   # false = remove points INSIDE the box (the arm)
