# AprilTag detector config. Detects two tag36h11 tags:
#   ID 0 -> saloni_tag (wall reference, used by apriltag_relocalizer for /initialpose)
#   ID 1 -> gripper_tag (wrist-mounted, for closed-loop pick)
#
# IMPORTANT: measure the ACTUAL printed black-square edge with a ruler and set
# the per-tag `sizes` entry to it in METERS. A wrong size scales the
# distance estimate linearly and ruins the relocalization/pose.
/apriltag_node:
    ros__parameters:
        image_transport: raw
        family: 36h11
        size: 0.13              # measured black-square edge = 130 mm
        max_hamming: 0
        qos_profile: default    # RELIABLE — matches RealSense pub; best_effort dropped
                                # large color frames over CycloneDDS (0 images received)
        pose_estimation_method: "pnp"

        detector:
            threads: 2
            decimate: 2.0
            blur: 0.0
            refine: True
            sharpening: 0.25
            debug: False

        # Reference wall tag + wrist-mounted gripper tag.
        tag:
            ids: [0, 1]
            frames: [saloni_tag, gripper_tag]
            sizes: [0.13, 0.03]  # gripper_tag: measured black-square edge = 30 mm
