teleop_twist_joy_node:
  ros__parameters:
    # DualSense (PS5) via Linux hid-playstation — same axis/button layout as
    # DS4, confirmed live 2026-06-22 with `ros2 topic echo /joy --once`
    # (8 axes, 13 buttons; L2/R2 triggers rest at 1.0, not -1.0).
    axis_linear:
      x: 1      # left stick vertical (up = forward)
    scale_linear:
      x: 0.20   # 2026-08-18: bumped from 0.10 (user: "a bit faster") for a new
                # mapping session. Still well under 0.50 (flat-out) — that
                # speed is what smeared the walls last time (point-cloud
                # spikes shooting out past the real room boundary), so this is
                # a middle ground, not a return to normal driving speed. Put
                # back to 0.50 once mapping is done and you're driving normally.
    scale_linear_turbo:
      x: 0.50

    axis_angular:
      yaw: 0    # left stick horizontal
    scale_angular:
      # 2026-07-29: 2.50 -> 1.20 at the user's request ("not so fast"). 2.50 was
      # 143 deg/s, which is more than a living room ever needs and made every
      # correction an overshoot. 1.20 is ~69 deg/s. See also max_angular_accel
      # in roomba_driver, which limits how fast this rate may be *reached*.
      # ‼️ NEVER go below ~0.35: the 879 has a ~0.31 rad/s rotation floor and
      # the wheels simply don't move under it.
      yaw: 1.20
    scale_angular_turbo:
      yaw: 1.80

    # Soft e-stop (joystick_estop_node, separate from this teleop): Circle (1)
    # latches the robot stopped, Share+Options (8+9) together resets. Distinct
    # from R1 below — the e-stop is sticky and survives a controller dropout.
    #
    # R1 dead-man's switch DISABLED (require_enable_button: false, 2026-08-16,
    # user request) — left stick alone now drives, no button held. Trade-off:
    # if the controller drops/idles while the stick is nonzero, there is no
    # longer an automatic cutoff from THIS node — only joystick_estop_node's
    # Circle e-stop remains as a safety stop, and that one is manual, not
    # automatic-on-dropout.
    enable_button: 5
    # L1 turbo DISABLED (was button 4) — L1 is now arm_joy's roll-negative
    # button (config/arm_joy_ps5.yaml), and holding it while R1 happened to
    # be down drove the robot forward at turbo speed instead of turning the
    # wrist. -1 means "no turbo button", matching arm_joy's own -1-to-unbind
    # convention; scale_linear_turbo/scale_angular_turbo above are now unused.
    enable_turbo_button: -1

    require_enable_button: false
