arm_joy:
  ros__parameters:
    # PS5 DualSense → RoArm-M3 manual jog (arm_joy_node.py).
    #
    # Right stick swings the base and raises/lowers the shoulder, the D-pad
    # extends the elbow (the joint that actually reaches forward) and tilts the
    # wrist; R1/R2 work the gripper. Axis/button indices follow the layout
    # confirmed live 2026-06-22 and re-confirmed against raw /dev/input/js0 on
    # 2026-07-29 (see the header of teleop_twist_joy_ps5.yaml).
    # D-pad axes (6/7) are digital: they read 0 or ±1, no partial deflection.
    axis_base: 3        # right stick horizontal
    axis_shoulder: 4    # right stick vertical
    axis_elbow: 7       # D-pad up/down    — extends the reach forward
    axis_wrist: 6       # D-pad left/right — tilts the hand

    # rad/s at full stick deflection. NEGATE any of these to flip that
    # direction — the RoArm wiki does not document which way its joints count
    # positive, so the signs here are a starting guess to be corrected on the
    # hardware:  ros2 param set /arm_joy scale_shoulder -0.5
    # Set an axis_* to -1 instead to unbind that joint entirely.
    # 2026-07-29: user asked for a faster arm. Doubled from the original
    # 0.60/0.50 after all five axes were confirmed tracking on hardware.
    # These are retunable live (see the parameter callback in the node):
    #   ros2 param set /arm_joy scale_base 1.6
    scale_base: 1.20
    scale_shoulder: 1.00
    scale_elbow: 1.00
    scale_wrist: 1.00

    # ‼️ R1 (button 5) is ALSO the drive dead-man in teleop_twist_joy_ps5.yaml
    # (enable_button: 5, require_enable_button: true) — it is held down for the
    # whole of every drive. Without an interlock the gripper would crawl open
    # every time the robot is driven, so R1 only counts for the gripper while
    # the LEFT stick is centred. Set drive_lockout: false to remove that.
    gripper_open_button: 5    # R1 — decreasing "hand" opens (T:106)
    gripper_close_button: 7   # R2
    scale_gripper: 0.80       # rad/s while held
    drive_lockout: true
    drive_lockout_axes: [0, 1]   # left stick

    # The sticks rest near, but not exactly at, zero.
    deadzone: 0.12
    rate: 20.0          # Hz — position commands to arm_driver
    joy_timeout: 0.5    # s of /joy silence before the sticks count as centred

    # How far the commanded target may run ahead of the arm's real position.
    # Guards the faster scales above: if a servo cannot keep up, the target is
    # reeled back in, so releasing the stick stops the arm near where you let
    # go instead of letting it coast on to a target that sprinted away.
    # Raise it for snappier response, lower it if the arm overshoots.
    max_lead: 0.35      # rad

    # ── Usable envelope, [lo, hi] radians ────────────────────────────────
    # MEASURED 2026-07-31, not taken from the wiki: the user cut servo torque
    # (T:210 cmd:0) and walked the arm by hand through the range they want it
    # to have, while every joint angle was recorded at 20 Hz (3212 samples).
    # These are those extremes pulled 2 deg inward, so a commanded move never
    # sits exactly on a hand-forced end stop.
    #
    # ‼️ Keep these identical to arm_driver's limit_* (bringup.launch.py). This
    # node stops the jog integrator winding past the limit; the driver is what
    # actually refuses the command. Out of sync, the stick would keep pushing
    # against a wall the driver silently clamps.
    #
    # Measured raw extremes, for reference when retuning:
    #   base     -174.7 .. +2.9 deg      shoulder  -81.5 .. +96.9 deg
    #   elbow      +6.1 .. +178.4 deg    wrist     -67.5 .. +82.6 deg
    #   roll      -68.7 .. +80.6 deg
    # ‼️ The shoulder reached +96.9 deg by hand, past the +90 deg the Waveshare
    # wiki gives as its stop, so the hi end is capped at the documented 1.57
    # rather than the measured 1.69 — driving a servo past its own limit is a
    # different risk from backdriving it there.
    #
    # SHOULDER RETUNED separately, same day: the hand-walked -81.5 deg let the
    # arm rise higher than wanted ("δεν θελω να πηγαινει πολυ πανω"), so the
    # user jogged it to the highest acceptable point and that reading, less the
    # 2 deg margin, became the lo end: -0.169 rad (-9.7 deg).
    # ‼️ UP IS THE NEGATIVE DIRECTION on this joint — raising the arm made the
    # angle fall from +1.6 to -11.7 deg. So the "how high" limit is `lo`, and
    # `hi` (1.57) is how far DOWN it may go. Do not swap them by reflex.
    limit_base:     [-3.015, 0.016]
    limit_shoulder: [-0.169, 1.570]
    limit_elbow:    [0.141, 3.079]
    limit_wrist:    [-1.143, 1.407]
