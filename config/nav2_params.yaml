amcl:
  ros__parameters:
    use_sim_time: false
    # alpha1/alpha2 = rotational odom noise (from rotation / from translation).
    # Lowered 0.2 -> 0.1 because heading comes from the EKF's absolute BNO085
    # yaw, not raw wheel odom — trusting it tightens the angular particle
    # spread so the pose stops wobbling/jumping on turns. alpha3/alpha4
    # (translation noise) stay 0.2: x/y is pure vx integration with no direct
    # measurement, so it genuinely drifts and AMCL must keep correcting it.
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5
    laser_max_range: 8.0
    laser_min_range: 0.1
    laser_model_type: likelihood_field
    max_beams: 180
    max_particles: 8000
    min_particles: 2000
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    # 2026-07-04: recovery injection DISABLED (was fast 0.1 / slow 0.001).
    # When measurement likelihood dips (unmapped chair, clutter), recovery
    # scatters random particles and in this symmetric apartment the pose
    # can teleport to a mirrored hypothesis — matches the at-rest AMCL yaw
    # jumps seen 2026-07-03 (51°→164° with the robot stationary). True
    # kidnapping is handled by the AprilTag relocalizer / /localize_globally
    # instead, so keep this off.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # Raised 10->20s 2026-07-05: on the kela3 kouzina run the robot progressed
      # ~1.8m then MPPI crept (~0.08 m/s, CostCritic-limited) through a narrow
      # passage below 0.5m/10s -> "Failed to make progress" -> recoveries -> whole
      # goal ABORTED (err 105). 20s tolerates momentary creep in tight spots.
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened 2026-07-05 after HW test: near a wall the robot legitimately
      # stalls ~0.23 m short (circumscribed 0.344 > inflation 0.30, CostCritic
      # gets conservative), so the old 0.10 xy tol was NEVER satisfied → endless
      # final-align spin → that prolonged in-place rotation is what made AMCL
      # yaw diverge 145° and lose the map. The loose yaw (0.6 rad ~34°) stops the
      # robot hunting an exact heading in place. Do NOT fix this by touching
      # footprint/inflation (both correct for kela3 doorways).
      # 0.25→0.30 2026-07-09: 0.25 gave only ~2cm margin over the ~0.23m stall,
      # and 0.23 is an estimate — near some walls the stall exceeded 0.25 and the
      # goal was never reached. 0.30 gives comfortable margin; fine for room-level
      # goto_room (taught points sit near walls), and precise picking uses its own
      # visual-servoing goal, not this checker. See project_robot_nav_path_wall_bug.
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.60
    # MPPI (Model Predictive Path Integral) — switched from
    # RegulatedPurePursuitController 2026-06-30. RPP only *follows* the global
    # path and stops at obstacles (relying on global replan); MPPI samples
    # ~2000 candidate trajectories every cycle and picks the lowest-cost one
    # that BOTH follows the path AND steers clear of obstacles in the local
    # costmap — i.e. real reactive obstacle avoidance. Limits match the robot:
    # vx_max 0.45, reverse to -0.10, wz_max 1.4, DiffDrive. The
    # velocity_smoother below still applies the final gentle accel ramp.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05            # = 1/controller_frequency (20Hz)
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0               # DiffDrive: no lateral motion
      wz_std: 0.4
      vx_max: 0.45            # 2026-07-28: 0.20 -> 0.45 at the user's request;
                              # the Roomba tops out near 0.5, this keeps margin
                              # for the local costmap to react to obstacles.
      # 2026-07-05: was -0.10 (reverse allowed). At a near-wall/unreachable goal
      # (e.g. toualeta) MPPI couldn't complete the forward approach (CostCritic
      # conservatism) and REVERSED to re-approach — but the collision_monitor is
      # direction-aware/front-only, so it did NOT stop the rear motion and the
      # robot backed its rear into a wall (rear clearance 0.09 m). Set to 0.0 so
      # FollowPath never commands reverse; it resolves near-wall goals by
      # rotate-and-forward instead. The behavior_server BackUp recovery still
      # reverses when genuinely needed (separate path, goes through smoother).
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.4            # 2026-07-28: 0.6 -> 1.4 at the user's request.
                              # Watch doorways: the 879 overshoots turns ~14%
                              # (project_robot_rotation_floor), and faster turns
                              # leave the local costmap less time to react.
      # 2026-07-05 ROOT-CAUSE FIX for the "spins in place, v≈0" bug. These are
      # the accel limits MPPI integrates its candidate trajectories with — the
      # FIRST commanded velocity can be at most ax_max*model_dt. The 2026-07-04
      # attempt to "match the velocity_smoother" set ax_max:0.25, which capped
      # the first command at 0.25*0.05 = 0.0125 m/s; the robot never ramped past
      # ~0.011 m/s, failed the progress checker, and fell into rotate/backup
      # recovery loops — THAT was the spin/oscillation, not a smoother mismatch.
      # MPPI's ax_* must be the robot's real accel capability; the
      # velocity_smoother below does the separate gentle output ramp. Verified in
      # the Gazebo sim (launch/sim.launch.py): robot now drives to goal at
      # 0.20 m/s and stops cleanly. (nav2 defaults are ax_max 2.5 / az_max 3.2.)
      ax_max: 2.5
      ax_min: -2.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true           # publishes candidate/optimal trajectories for RViz
      reset_period: 1.0
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Obstacle avoidance. consider_footprint MUST stay false while the
      # costmaps declare `robot_radius` instead of a `footprint` polygon
      # (they do since 9957842, the Roomba 879 chassis swap): MPPI's
      # CostCritic throws "Considering footprint in collision checking but no
      # robot footprint provided in the costmap" on configure, controller_server
      # fails its transition and lifecycle_manager aborts the whole nav chain.
      # No loss here — the 879 footprint really is a Ø0.40 m circle, so radius
      # checking is exact rather than an approximation. Only switch this back
      # to true together with restoring a polygon footprint.
      CostCritic:
        enabled: true
        cost_power: 1
        # Lowered 3.81->2.0 2026-07-05: at 3.81 the footprint-aware CostCritic
        # over-penalized every forward trajectory in narrow passages (footprint
        # circumscribed 0.344 > inflation 0.30), so MPPI crept ~0.08 m/s and
        # trembled (wz oscillation) instead of driving. Teleop was unaffected.
        # inflation stays 0.30 per project decision.
        cost_weight: 2.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

# Was running with no explicit config (all nav2 defaults: max_accel 2.5 m/s²
# linear / 3.2 rad/s² angular) — that's a near-instant jump to full speed,
# felt like "too much gas" at the start of every move. These limits ramp
# cmd_vel_nav -> cmd_vel_smoothed gently regardless of what FollowPath or
# behavior_server (spin/backup) request.
velocity_smoother:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.45, 0.0, 1.4]   # must track FollowPath.vx_max above, or
                                     # the smoother silently caps the controller
    min_velocity: [-0.10, 0.0, -1.4]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # 2026-07-04: raised from [0.05,0,0.5]/[-0.1,0,-0.8]. 0.05 m/s² was 10x
    # tighter than MPPI's ax_max — the controller's planned v never
    # materialized (4s to reach 0.2 m/s) while w did, causing the
    # spin-in-place oscillation. 0.25 still ramps gently (0.8s to full
    # speed on a 0.2 m/s robot). MUST stay equal to MPPI ax_max/ax_min/
    # az_max above — the controller assumes these are executable.
    # 2026-07-28: 0.25 -> 1.0 m/s². The old value took ~2 s to reach top
    # speed, which is what actually made the robot feel slow — the velocity
    # ceiling was never the binding constraint.
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.2, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 2026-07-04: was 0.60x0.50 ([[0.27,0.25],[0.27,-0.25],[-0.33,-0.25],
      # [-0.33,0.25]]) — 5cm wider on every side than even the collision
      # monitor's user-measured Stop polygon (front 0.22 / rear -0.28 /
      # sides ±0.20, which itself already includes clearance margins around
      # the Ø0.34m Roomba). The padding raised the inscribed radius to 0.25,
      # so every chair/table leg killed a Ø0.50 disc of costmap and whole
      # regions (kouzina) went lethal — planner couldn't even start from a
      # parked pose. Now matches the Stop polygon exactly: 0.50x0.40,
      # inscribed 0.20, circumscribed 0.344.
      # 2026-07-21, Roomba 879 chassis: replaced that rectangle with a circular
      # footprint. 2026-07-31: the user re-measured the chassis as **Ø0.35 m**,
      # not the Ø0.40 recorded here, so the radius goes 0.20 -> 0.175. That is
      # 2.5 cm of extra clearance on EVERY side of every gap, which is a lot
      # when the doors are the tightest thing the robot meets.
      # Side effect worth knowing: circumscribed drops to 0.175, still BELOW
      # inflation_radius, which clears the long-standing Nav2
      # "inflation < circumscribed" ERROR and restores MPPI CostCritic's
      # potential-field shortcut.
      robot_radius: 0.175
      # keepout_filter is harmless when use_keepout:=false (the default) —
      # filter_mask_server/costmap_filter_info_server just aren't running,
      # so this layer waits quietly for filter info and never applies
      # anything. Placeholder mask (config/keepout_mask.yaml/.pgm) is
      # entirely free until edited — see its header comment for the plan
      # (RViz Publish Point on couch/table spots once a real map exists).
      plugins: ["voxel_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        # Off until keepout zones are redrawn for the kela3 frame AND
        # use_keepout:=true runs the mask servers — enabled without them it
        # WARNs "Filter mask was not received" every costmap update, forever.
        enabled: False
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Deliberately below the 0.344 circumscribed footprint radius: Nav2
        # logs an ERROR and MPPI CostCritic loses its potential-field shortcut,
        # but consider_footprint: true compensates (full-footprint checks),
        # and >=0.40 risks sealing the doorways. Don't raise without
        # re-measuring the doorways on the map in use.
        # 2026-07-31, malou2: 0.30 -> 0.22. The doorways here are NOT ~0.78 m —
        # measured on this map, the tightest passage from saloni to kouzina is
        # 0.60 m (largest radius that still connects them: 0.300). With
        # inflation 0.30 the collars from the two jambs meet exactly in the
        # middle, so the centre line of every door carried near-inscribed cost
        # and the robot stalled in the opening — reported live as "κόλλησε στην
        # πόρτα". At 0.22 the door centre is plain 0-cost floor. This changes
        # only where the robot PREFERS to drive: lethal is still robot_radius
        # 0.20, so it cannot clip a jamb.
        inflation_radius: 0.22
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan depth_camera predicted_obstacles semantic_obstacles
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        depth_camera:
          topic: /camera/camera/depth/color/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        predicted_obstacles:
          topic: /predicted_obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        semantic_obstacles:
          topic: /semantic_obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # 2026-07-04: was 0.60x0.50 ([[0.27,0.25],[0.27,-0.25],[-0.33,-0.25],
      # [-0.33,0.25]]) — 5cm wider on every side than even the collision
      # monitor's user-measured Stop polygon (front 0.22 / rear -0.28 /
      # sides ±0.20, which itself already includes clearance margins around
      # the Ø0.34m Roomba). The padding raised the inscribed radius to 0.25,
      # so every chair/table leg killed a Ø0.50 disc of costmap and whole
      # regions (kouzina) went lethal — planner couldn't even start from a
      # parked pose. Now matches the Stop polygon exactly: 0.50x0.40,
      # inscribed 0.20, circumscribed 0.344.
      # 2026-07-21, Roomba 879 chassis: circular Ø0.40 m footprint (see the
      # matching note in local_costmap above).
      robot_radius: 0.175
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        # Off until keepout zones are redrawn for the kela3 frame AND
        # use_keepout:=true runs the mask servers — enabled without them it
        # WARNs "Filter mask was not received" every costmap update, forever.
        enabled: False
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Deliberately below the 0.344 circumscribed footprint radius: Nav2
        # logs an ERROR and MPPI CostCritic loses its potential-field shortcut,
        # but consider_footprint: true compensates (full-footprint checks),
        # and >=0.40 risks sealing the doorways. Don't raise without
        # re-measuring the doorways on the map in use.
        # 2026-07-31, malou2: 0.30 -> 0.22. The doorways here are NOT ~0.78 m —
        # measured on this map, the tightest passage from saloni to kouzina is
        # 0.60 m (largest radius that still connects them: 0.300). With
        # inflation 0.30 the collars from the two jambs meet exactly in the
        # middle, so the centre line of every door carried near-inscribed cost
        # and the robot stalled in the opening — reported live as "κόλλησε στην
        # πόρτα". At 0.22 the door centre is plain 0-cost floor. This changes
        # only where the robot PREFERS to drive: lethal is still robot_radius
        # 0.20, so it cannot clip a jamb.
        inflation_radius: 0.22
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    # Stock Nav2 forward-creep primitive — collision-checked like BackUp/Spin.
    # Used by the custom BT (config/behavior_trees/) and recovery_manager_node
    # as the doorway recovery that doesn't sweep the footprint like Spin does.
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    spin_dist: 1.57
    linear_vel: -0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    use_sim_time: false

collision_monitor:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # Was "cmd_vel" — but that's also the raw command topic teleop/llm_bridge
    # publish to, so a relay from cmd_vel into cmd_vel_smoothed (joystick
    # path, 2026-06-22) plus this node echoing back out to "cmd_vel" would
    # loop forever. roomba_driver already listens on cmd_vel_safe, so this
    # is the single point where ANY command source (joystick, Nav2's own
    # autonomous chain, llm_bridge) gets the obstacle-distance check applied
    # before reaching the motors.
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["Stop", "FootprintApproach"]
    # Last-resort hard stop, independent of the velocity-based prediction
    # below. If anything the lidar sees ever ends up inside the *relevant*
    # sub-polygon for the commanded direction, cmd_vel is zeroed immediately
    # — catches cases FootprintApproach's time-to-collision estimate could
    # miss (sensor noise/latency, something appearing right next to the
    # robot, a bad recovery behavior, etc).
    #
    # type: velocity_polygon (not a single static "polygon") — a plain
    # static box stops ALL motion the instant anything enters it on ANY
    # side, even motion that's moving AWAY from the violating side (e.g.
    # something 400mm behind blocked driving forward too, confirmed live
    # 2026-06-22). velocity_polygon instead picks one of several
    # sub-polygons to check based on the commanded linear.x, so reversing
    # only checks the rear sub-polygon and driving forward only checks the
    # front one.
    #
    # 2026-07-21, Roomba 879: the old clearances were measured from the lidar
    # when it sat at x=+0.12; the lidar is now centred at x=0.0, so they no
    # longer mean anything (the old front edge 0.10 would fall INSIDE the
    # robot). Re-specified by the user as a uniform 50mm margin around the body.
    #
    # The two radii in play are different things, and it matters here:
    #   - the PHYSICAL robot is Ø0.34 m    -> radius 0.17
    #   - the costmap footprint is Ø0.40 m -> radius 0.20, i.e. the user already
    #     padded it by 30mm so the planner keeps its distance from obstacles
    # The 50mm stop margin is measured from the *physical* body, so every edge
    # sits at 0.17 + 0.05 = 0.22. (Measuring from the padded 0.20 instead would
    # have given 0.25, i.e. 80mm of real clearance — more than was asked for.)
    # 0.22 still exceeds the 0.20 footprint, so the stop box never cuts inside
    # what the planner considers to be the robot.
    #
    # This also buys doorway margin: kela3 doorways are only ~0.78 m, where a
    # 0.50 m-wide stop box would leave ~70mm per side; 0.44 m leaves ~170mm.
    Stop:
      type: "velocity_polygon"
      action_type: "stop"
      holonomic: false
      velocity_polygons: ["moving_forward", "moving_backward", "stopped_or_rotating"]
      moving_forward:
        points: "[[0.22, 0.22], [0.22, -0.22], [-0.05, -0.22], [-0.05, 0.22]]"
        linear_min: 0.02
        linear_max: 1.0
        theta_min: -10.0
        theta_max: 10.0
      moving_backward:
        points: "[[0.05, 0.22], [0.05, -0.22], [-0.22, -0.22], [-0.22, 0.22]]"
        linear_min: -1.0
        linear_max: -0.02
        theta_min: -10.0
        theta_max: 10.0
      stopped_or_rotating:
        points: "[[0.22, 0.22], [0.22, -0.22], [-0.22, -0.22], [-0.22, 0.22]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -10.0
        theta_max: 10.0
      min_points: 3
      visualize: false
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # 2026-07-08: 1.2->0.9. At 1.2s the approach zone triggered ~0.46m out
      # and chopped MPPI's velocity to a stutter (cmd_vel_safe 0.045,0,0.035,0)
      # → near-zero net progress near obstacles. 0.9 lets the robot keep
      # moving a bit closer so MPPI has room to steer around; HW-verified it
      # then drove ~1.8m smoothly with AMCL staying locked (was frozen before).
      time_before_collision: 0.9
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    # Disable node-side lifecycle bond — see bringup.launch.py nav2 section.
    bond_heartbeat_period: 0.0
    use_sim_time: false
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # HuberLoss down-weights outlier scan-matches (noisy/spurious lidar
    # returns, e.g. from carpet transitions or off-axis reflections)
    # instead of letting them pull the optimizer/map off — addresses
    # "noisy/smeared map" symptoms.
    ceres_loss_function: HuberLoss
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    # "Lifelong mapping": stays in `mapping` mode (keeps updating the map
    # as furniture/objects move — important for a tidying robot) but can
    # resume localizing in + extending a previously saved map via
    # map_file_name below, instead of starting from an empty map every
    # bringup.
    mode: mapping
    use_map_saver: true
    # After a good mapping session, save the pose-graph with:
    #   ~/robot_ws/src/home_robot/scripts/save_map.sh home
    # then uncomment map_file_name (and map_start_pose, if not starting
    # at the dock) to resume + keep extending that map on next bringup.
    # map_file_name: /home/dimi/robot_ws/src/home_robot/maps/home
    map_start_pose: [0.0, 0.0, 0.0]  # rough; correct via RViz "2D Pose Estimate" after launch
    # Lifelong-mapping tuning (only matters once map_file_name is set —
    # controls how scan matches against the OLD loaded map vs NEW scans
    # are weighted when deciding to keep/replace map data). Defaults from
    # slam_toolbox's mapper_params_lifelong.yaml.
    lifelong_search_use_tree: false
    lifelong_minimum_score: 0.1
    lifelong_iou_match: 0.85
    lifelong_node_removal_score: 0.04
    lifelong_overlap_score_scale: 0.06
    lifelong_constraint_multiplier: 0.08
    lifelong_nearby_penalty: 0.001
    lifelong_candidates_scale: 0.03
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: true
    # Lowered again from 0.2/0.2 — was tuned for the old MPU9250
    # (gyro-only, no magnetometer, drifted between scan-matcher updates).
    # Now using a BNO085 (absolute heading via magnetometer, see ekf.yaml
    # header) so this is more conservative than strictly necessary, but
    # left as-is since frequent matching is still harmless. Original
    # rationale: large gaps let yaw drift build up unnoticed until a
    # loop-closure/match correction snaps it back all at once, showing up
    # as walls abruptly "doubling".
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # Raised from 3.0 — with no magnetometer the IMU's yaw can drift enough
    # over a full-room traverse that a true loop-closure candidate (same
    # physical spot, revisited later) ends up slightly farther apart in the
    # current pose-graph estimate than the old 3.0m search radius allowed,
    # so the correction that would fix the drift never gets considered.
    loop_search_maximum_distance: 6.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

# ── Keepout zones (use_keepout:=true, default false) ──────────────────
# filter_mask_server's yaml_filename is overridden at launch time
# (bringup.launch.py) to point at config/keepout_mask.yaml's real
# installed path, same pattern as slam_toolbox's map_file_name override.
filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    filter_info_topic: /costmap_filter_info
    # Must be absolute — KeepoutFilter resolves this name inside its own
    # costmap's namespace (local_costmap/global_costmap), so a relative
    # name here resolved to e.g. /local_costmap/keepout_filter_mask
    # instead of the actual /keepout_filter_mask filter_mask_server
    # publishes on, and the mask was silently never received.
    mask_topic: /keepout_filter_mask
    type: 0
    base: 0.0
    multiplier: 1.0

# The three servers below run with stock defaults; sections exist only to
# disable their lifecycle bonds (see bringup.launch.py nav2 section).
smoother_server:
  ros__parameters:
    bond_heartbeat_period: 0.0
route_server:
  ros__parameters:
    bond_heartbeat_period: 0.0
waypoint_follower:
  ros__parameters:
    bond_heartbeat_period: 0.0
